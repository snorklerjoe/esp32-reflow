; Reflow Oven Controller — NodeMCU ESP-32S v1.1 (ESP-WROOM-32)
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; Passwords come from .env at compile time (copy .env.example -> .env).
; The web app in web/ is gzipped and embedded into the firmware automatically,
; so there is no separate filesystem image to upload.

[env:nodemcu-32s]
platform = espressif32 @ ^6.9.0
board = nodemcu-32s
framework = arduino
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

extra_scripts =
    pre:scripts/load_env.py
    pre:scripts/embed_web.py

lib_deps =
    ESP32Async/AsyncTCP @ ^3.4.0
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.2.0

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
